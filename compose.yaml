services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - pwa_node_modules:/workspace/lib/war_analyzer/pwa/node
      - ~/.ssh:/root/.ssh:ro
    ports:
      - "5173:5173"
    command: sleep infinity

volumes:
  pwa_node_modules:
